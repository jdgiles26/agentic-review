[project]
name = "agentic-review-platform"
version = "0.2.0"
description = "Agentic AI platform for code review, PR specialists, GitHub automation, callable API + CLI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "PyGithub>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx",
]

[project.scripts]
review = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "graphs", "tools", "memory", "schemas", "api", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI / Typer declare parameters with call defaults
    "UP042",  # keep (str, Enum): StrEnum changes str() output of serialized values
]

[tool.ruff.lint.per-file-ignores]
"cli/main.py" = ["UP045"]  # Typer resolves Optional[...] annotations at runtime

[tool.coverage.run]
source = ["agents", "api", "cli", "graphs", "memory", "schemas", "tools"]
