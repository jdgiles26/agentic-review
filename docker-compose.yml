  #   working_dir: /app
  #   volumes:
  #     - ./ui:/app
  #   command: sh -c "npm install && npm run dev"
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  review-data:
